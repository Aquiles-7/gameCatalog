<div class="min-h-screen bg-slate-50 p-4">
  <div class="mx-auto w-full max-w-4xl rounded-4xl bg-white px-6 py-8 shadow-lg">
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div class="mt-5">
        <h1 class="text-3xl font-semibold text-slate-900">Mi perfil</h1>
        <p class="text-sm text-slate-600">Edita tus datos y revisa lista de deseado.</p>
      </div>
      <button
        class="rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-700"
        (click)="logout()"
      >
        Cerrar sesión
      </button>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="mt-8 grid gap-6">
      <div>
        <label class="mb-2 block text-sm font-medium text-slate-700">Nombre</label>
        <input
          type="text"
          formControlName="name"
          class="w-full rounded-3xl border border-slate-300 bg-slate-50 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500"
          [class.border-red-500]="submitted && name.errors"
        />
        <p class="mt-2 text-sm text-red-600" *ngIf="submitted && name.errors">
          <span *ngIf="name.hasError('required')">Nombre es obligatorio.</span>
          <span *ngIf="name.hasError('pattern')">Usa sólo letras y espacios.</span>
        </p>
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-slate-700">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full rounded-3xl border border-slate-300 bg-slate-50 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-sky-500"
          [class.border-red-500]="submitted && password.errors"
          placeholder="Cambia tu contraseña aquí"
        />
        <p class="mt-2 text-sm text-red-600" *ngIf="submitted && password.errors">
          <span *ngIf="password.hasError('required')">Contraseña es obligatoria.</span>
          <span *ngIf="password.hasError('minlength')">Mínimo 4 caracteres.</span>
        </p>
      </div>

      <div class="lg:col-span-2">
        <button
          type="submit"
          class="rounded-3xl bg-cyan-800 px-3 py-2 text-base font-bold text-sky-50 hover:bg-slate-900"
        >
          Guardar cambios
        </button>
        <p class="mt-3 text-sm text-emerald-600" *ngIf="message">{{ message }}</p>
      </div>
    </form>

    <div class="mt-10">
      <h2 class="text-2xl font-semibold text-slate-900">Mi Lista</h2>
      <p class="mt-2 text-sm text-slate-600">Aquí verás tu lista de deseos.</p>

      <div class="mt-6 rounded-3xl border border-dashed border-slate-300 bg-slate-50 p-6 text-slate-600">
        No hay juegos en tu lista.
      </div>
    </div>
    

  </div>
</div>
