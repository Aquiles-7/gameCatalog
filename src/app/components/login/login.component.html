<div class="flex min-h-screen items-center justify-center bg-slate-50 p-4">
  <div class="w-full max-w-lg rounded-3xl bg-white p-8 shadow-lg">
    <h2 class="mb-6 text-2xl font-semibold text-slate-900">Iniciar Sesión</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-4">
          <input class="mb-2 block w-full rounded-xl border border-slate-300 px-4 py-3 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-sky-500 focus:outline-none" matInput placeholder="Email" formControlName="email" />
      </div>
      <div>
          <input class="mb-2 block w-full rounded-xl border border-slate-300 px-4 py-3 text-sm font-medium text-slate-700 focus:ring-2 focus:ring-sky-500 focus:outline-none" matInput placeholder="Password" type="password" formControlName="password" />
      </div>
      <button class="mb-2 w-full rounded-2xl bg-sky-600 px-4 py-3 font-semibold text-white hover:bg-sky-700 disabled:opacity-50" >Iniciar Sesión</button>
      <div class="mt-6 text-center text-sm text-slate-600">
        <span>¿No tienes cuenta?</span>
        <a routerLink="/register" class="font-semibold text-sky-600 hover:text-sky-700">Regístrate</a>
      </div>
    </form>
      <button class="mb-2 w-full rounded-2xl border-e-slate-950 px-4 py-3 font-semibold text-gray-900 hover:bg-slate-950 hover:text-sky-100 disabled:opacity-50" mat-flat-button color="primary" type="button" (click)="onClickGoogle()">Log in with Google</button>
  </div>
</div>
