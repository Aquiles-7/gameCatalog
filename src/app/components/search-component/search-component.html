<div class="relative w-full max-w-xs">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"
    class="pointer-events-none absolute top-1/2 left-3 h-5 w-5 -translate-y-1/2 fill-gray-400">
    <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-420q67 0 113.5-46.5T540-580q0-67-46.5-113.5T380-740q-67 0-113.5 46.5T220-580q0 67 46.5 113.5T380-420Z" />
  </svg>

  <input
    type="text"
    [value]="searchText()"
    (input)="onInput($event)"
    placeholder="Buscar juegos..."
    aria-label="Buscar juegos"
    class="w-full rounded-lg bg-gray-700 py-2 pr-9 pl-10 text-gray-200 placeholder-gray-400 outline-none focus:ring-2 focus:ring-sky-500" />

  @if (searchText()) {
    <button
      type="button"
      (click)="clear()"
      aria-label="Limpiar búsqueda"
      class="absolute top-1/2 right-2 -translate-y-1/2 cursor-pointer rounded-full p-1 text-gray-400 hover:text-gray-200">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="h-4 w-4 fill-current">
        <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
      </svg>
    </button>
  }
</div>
